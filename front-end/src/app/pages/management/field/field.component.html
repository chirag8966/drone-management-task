<div class="card">
    <div class="card-header">
        <h4 class="card-title">Field Details</h4>
    </div>
    <div class="card-body">
        <div class="alert alert-info" *ngIf="fieldId">
            <app-recent-missions [id]="fieldId" />
        </div>
        <div class="alert alert-warning" *ngIf="!fieldId">
            No field ID provided in query parameters
        </div>
    </div>
</div>
